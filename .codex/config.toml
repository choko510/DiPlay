# Sol + Luna project-local Codex configuration
# Drop this .codex directory at the repository root.

# Sol is the root coordinator: planning, architecture, diagnosis, review, integration.
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"

# Keep normal model prose terse. This does not reduce reasoning effort; it mainly
# prevents unnecessary explanatory output from consuming context.
model_verbosity = "low"
model_reasoning_summary = "concise"

# Context / token economy. Codex clamps the compact limit when the selected
# model has a smaller usable context window. Compact before extremely large
# conversations become expensive or unwieldy.
model_auto_compact_token_limit = 220000
model_auto_compact_token_limit_scope = "total"
model_post_turn_compact_threshold_percent = 80

# Bound how much tool/function output is retained in model-visible context.
# Agents are instructed below to narrow commands before relying on truncation.
tool_output_token_limit = 8000

[agents]
enabled = true

# Any generic spawned worker defaults to Luna Max.
# This is intentional: Luna is cheap enough to spend reasoning on bounded coding work.
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

# Up to six spawned workers in addition to the primary thread on the global agents path.
max_concurrent_threads_per_session = 6

# Explicit named roles. These are useful when the current Codex surface resolves
# project-local custom agents correctly. The workflow does not depend on them:
# generic children still default to Luna Max.
[agents.sol_architect]
description = "Sol architecture agent for design decisions and implementation contracts; read-only."
config_file = "agents/sol_architect.toml"

[agents.sol_reviewer]
description = "Independent Sol reviewer for plans and completed diffs; read-only."
config_file = "agents/sol_reviewer.toml"

[agents.luna_scout]
description = "Luna repository scout for fast bounded evidence gathering; read-only."
config_file = "agents/luna_scout.toml"

[agents.luna_implementer]
description = "Luna Max implementation worker for bounded approved coding slices."
config_file = "agents/luna_implementer.toml"

[agents.luna_tester]
description = "Luna xhigh verification worker for tests, builds, reproductions, and concrete validation."
config_file = "agents/luna_tester.toml"

# Do not force multi_agent_v2 here. Current Codex/model catalogs may select the
# appropriate multi-agent backend themselves, and forcing V2 has caused custom
# role/model-selection regressions in some CLI releases. `[agents]` remains the
# stable project-level orchestration configuration.
