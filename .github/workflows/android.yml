name: Android checks
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
concurrency:
  group: android-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      full_host: ${{ steps.classify.outputs.full_host }}
      quick: ${{ steps.classify.outputs.quick }}
      quick_scope: ${{ steps.classify.outputs.quick_scope }}
      native: ${{ steps.classify.outputs.native }}
      instrumentation: ${{ steps.classify.outputs.instrumentation }}
      safe: ${{ steps.classify.outputs.safe }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify PR changes
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          full_fallback() {
            echo "full_host=true" >> "$GITHUB_OUTPUT"
            echo "quick=false" >> "$GITHUB_OUTPUT"
            echo "quick_scope=both" >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "instrumentation=true" >> "$GITHUB_OUTPUT"
            echo "safe=false" >> "$GITHUB_OUTPUT"
          }

          diff_base="$PR_BASE_SHA"
          diff_operator="..."
          if [[ "$PR_DRAFT" == "true" ]]; then
            workflow_runs_file="$RUNNER_TEMP/step4-workflow-runs.json"
            if ! curl --fail --silent --show-error --location --retry 2 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --get \
              --data-urlencode "branch=${PR_HEAD_REF}" \
              --data-urlencode "event=pull_request" \
              --data-urlencode "per_page=100" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs" \
              > "$workflow_runs_file"; then
              full_fallback
              exit 0
            fi
            if ! previous_success_sha=$(jq -r \
              --arg pr "$PR_NUMBER" \
              --arg base "$PR_BASE_SHA" \
              --arg current_run "$GITHUB_RUN_ID" \
              '[.workflow_runs[]?
                | select(
                    .path == ".github/workflows/android.yml" and
                    .event == "pull_request" and
                    .conclusion == "success" and
                    (.id | tostring) != $current_run and
                    any(.pull_requests[]?; (.number | tostring) == $pr and .base.sha == $base)
                  )
                | .head_sha
              ] | first // empty' "$workflow_runs_file"); then
              full_fallback
              exit 0
            fi
            if [[ -n "$previous_success_sha" ]]; then
              if ! git cat-file -e "${previous_success_sha}^{commit}" || \
                ! git merge-base --is-ancestor "$previous_success_sha" "$PR_HEAD_SHA"; then
                full_fallback
                exit 0
              fi
              diff_base="$previous_success_sha"
              diff_operator=".."
            fi
          fi

          changed_paths_file="$RUNNER_TEMP/step4-changed-paths.nul"
          if ! git diff --name-only -z "${diff_base}${diff_operator}${PR_HEAD_SHA}" > "$changed_paths_file"; then
            full_fallback
            exit 0
          fi
          mapfile -d '' -t paths < "$changed_paths_file"
          if (( ${#paths[@]} == 0 )); then
            full_fallback
            exit 0
          fi
          if (( ${#paths[@]} >= 100 )); then
            full_fallback
            exit 0
          fi

          runtime=false
          native=false
          force_full=false
          unscoped_runtime=false
          shared_test_only=false
          common_only=false
          for path in "${paths[@]}"; do
            [[ -z "$path" ]] && continue
            case "$path" in
              docs/*|.scratchpad/*|.github/workflows/*|*.md) ;;
              shared/src/test/java/*|shared/src/test/kotlin/*)
                runtime=true
                shared_test_only=true ;;
              common/src/main/java/*|common/src/main/kotlin/*|common/src/test/java/*|common/src/test/kotlin/*)
                runtime=true
                common_only=true ;;
              shared/src/main/jni/dsp/*|shared/src/main/jni/third_party/kissfft/*|shared/src/test/native/dsp/*|scripts/test_dsp_native.sh)
                runtime=true
                native=true
                unscoped_runtime=true ;;
              shared/src/main/jni/*|shared/src/test/native/*)
                runtime=true
                force_full=true
                unscoped_runtime=true ;;
              *build.gradle*|*settings.gradle*|gradle.properties|*/gradle.properties|gradle/*|gradlew|gradlew.bat|*.toml)
                runtime=true
                force_full=true
                unscoped_runtime=true ;;
              shared/*|common/*|mobile/*|automotive/*)
                runtime=true
                unscoped_runtime=true ;;
              *)
                runtime=true
                force_full=true
                unscoped_runtime=true ;;
            esac
          done

          quick_scope=none
          if [[ "$runtime" == "true" ]]; then
            if [[ "$unscoped_runtime" == "true" || ( "$shared_test_only" == "true" && "$common_only" == "true" ) ]]; then
              quick_scope=both
            elif [[ "$shared_test_only" == "true" ]]; then
              quick_scope=shared
            elif [[ "$common_only" == "true" ]]; then
              quick_scope=common
            else
              quick_scope=both
            fi
          fi

          full_host=false
          quick="$runtime"
          instrumentation=false
          safe=true
          if [[ "$PR_DRAFT" != "true" || "$force_full" == "true" ]]; then
            full_host=true
            quick=false
            quick_scope=both
            instrumentation=true
            if [[ "$force_full" == "true" ]]; then
              safe=false
            fi
          fi

          echo "full_host=$full_host" >> "$GITHUB_OUTPUT"
          echo "quick=$quick" >> "$GITHUB_OUTPUT"
          echo "quick_scope=$quick_scope" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "instrumentation=$instrumentation" >> "$GITHUB_OUTPUT"
          echo "safe=$safe" >> "$GITHUB_OUTPUT"
          echo "Android CI lane: comparison=${diff_base}${diff_operator}${PR_HEAD_SHA} full_host=$full_host quick=$quick quick_scope=$quick_scope native=$native instrumentation=$instrumentation safe=$safe"

  check:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        if: github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full_host == 'true' || needs.changes.outputs.quick == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        if: github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full_host == 'true'
        with:
          packages: platform-tools platforms;android-37.0 platforms;android-37.1 build-tools;36.0.0 ndk;27.0.12077973
      - uses: android-actions/setup-android@v3
        if: github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.quick == 'true' && needs.changes.outputs.full_host != 'true'
        with:
          packages: platforms;android-37.0 platforms;android-37.1 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full_host == 'true' || needs.changes.outputs.quick == 'true'
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Host native DSP tests
        if: github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full_host == 'true' || needs.changes.outputs.native == 'true'
        run: bash scripts/test_dsp_native.sh
      - name: Host native DSP tests with ASan and UBSan
        if: github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full_host == 'true' || needs.changes.outputs.native == 'true'
        run: bash scripts/test_dsp_native.sh --sanitize
      - name: Draft unit tests (shared and common)
        if: github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.quick == 'true' && needs.changes.outputs.full_host != 'true' && needs.changes.outputs.quick_scope != 'shared' && needs.changes.outputs.quick_scope != 'common'
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest --build-cache --parallel --stacktrace
      - name: Draft unit tests (shared only)
        if: github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.quick == 'true' && needs.changes.outputs.full_host != 'true' && needs.changes.outputs.quick_scope == 'shared'
        run: ./gradlew :shared:testDebugUnitTest --build-cache --parallel --stacktrace
      - name: Draft unit tests (common only)
        if: github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.quick == 'true' && needs.changes.outputs.full_host != 'true' && needs.changes.outputs.quick_scope == 'common'
        run: ./gradlew :common:testDebugUnitTest --build-cache --parallel --stacktrace
      - name: Unit tests, lint, debug and optimized builds
        if: github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full_host == 'true'
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :automotive:lintDebug :mobile:assembleDebug :automotive:assembleDebug :mobile:assembleBenchmark :automotive:assembleBenchmark --build-cache --parallel --stacktrace
      - name: Verify JNI names survive R8
        if: github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full_host == 'true'
        run: python3 scripts/check_jni_mapping.py

      - name: Test reports
        if: always() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.full_host == 'true' || needs.changes.outputs.quick == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.job }}
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            automotive/build/reports/lint-results-debug.html

  android-instrumentation:
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       needs.changes.result != 'success' ||
       github.event.pull_request.draft == false ||
       needs.changes.outputs.instrumentation == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 platforms;android-37.1 build-tools;36.0.0 ndk;27.0.12077973 system-images;android-35;google_apis;x86_64
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android Emulator binary
        run: |
          curl --fail --location --retry 3 "https://dl.google.com/android/repository/emulator-linux_x64-16433917.zip" -o "$RUNNER_TEMP/emulator.zip"
          unzip -o -q "$RUNNER_TEMP/emulator.zip" -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/emulator/emulator"
      - name: Enable KVM for x86_64 emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: JNI DSP smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash scripts/run_android_instrumentation.sh
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.job }}
          path: |
            shared/build/reports/tests/
            shared/build/outputs/dsp-benchmark/
