name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 platforms;android-37.1 build-tools;36.0.0 ndk;27.0.12077973 emulator system-images;android-35;google_apis;x86_64
      - uses: gradle/actions/setup-gradle@v4
      - name: Host native DSP tests
        run: bash scripts/test_dsp_native.sh
      - name: Host native DSP tests with ASan and UBSan
        run: bash scripts/test_dsp_native.sh --sanitize
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :automotive:lintDebug :mobile:assembleDebug :automotive:assembleDebug --stacktrace
      - name: Start x86_64 emulator
        run: |
          echo no | avdmanager create avd --force --name dsp-x86_64 --package "system-images;android-35;google_apis;x86_64"
          emulator -avd dsp-x86_64 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect &
          adb wait-for-device
          while [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]]; do sleep 1; done
      - name: JNI DSP smoke test
        run: ./gradlew :shared:connectedDebugAndroidTest --stacktrace
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            automotive/build/reports/lint-results-debug.html
