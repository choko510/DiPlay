name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 platforms;android-37.1 build-tools;36.0.0 ndk;27.0.12077973 system-images;android-35;google_apis;x86_64
      - uses: gradle/actions/setup-gradle@v4
      - name: Host native DSP tests
        run: bash scripts/test_dsp_native.sh
      - name: Host native DSP tests with ASan and UBSan
        run: bash scripts/test_dsp_native.sh --sanitize
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :automotive:lintDebug :mobile:assembleDebug :automotive:assembleDebug --stacktrace
      - name: Install Android Emulator binary
        run: |
          curl --fail --location --retry 3 "https://dl.google.com/android/repository/emulator-linux_x64-16433917.zip" -o "$RUNNER_TEMP/emulator.zip"
          unzip -o -q "$RUNNER_TEMP/emulator.zip" -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/emulator/emulator"
      - name: JNI DSP smoke test
        run: |
          mkdir -p "$HOME/.android/avd"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          avdmanager create avd -f -n dsp-x86_64 -k "system-images;android-35;google_apis;x86_64" -d pixel_7_pro
          avdmanager list avd
          test -f "$ANDROID_AVD_HOME/dsp-x86_64.ini"
          "$ANDROID_HOME/emulator/emulator" -avd dsp-x86_64 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect &
          timeout 180s adb wait-for-device
          booted=false
          for attempt in $(seq 1 180); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [[ "$booted" != "true" ]]; then
            echo "x86_64 emulator failed to boot" >&2
            exit 1
          fi
          ./gradlew :shared:connectedDebugAndroidTest --stacktrace
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            automotive/build/reports/lint-results-debug.html
