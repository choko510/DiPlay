name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 platforms;android-37.1 build-tools;36.0.0 ndk;27.0.12077973 system-images;android-35;google_apis;x86_64
      - uses: gradle/actions/setup-gradle@v4
      - name: Host native DSP tests
        run: bash scripts/test_dsp_native.sh
      - name: Host native DSP tests with ASan and UBSan
        run: bash scripts/test_dsp_native.sh --sanitize
      - name: Unit tests, lint, debug and optimized builds
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :automotive:lintDebug :mobile:assembleDebug :automotive:assembleDebug :mobile:assembleBenchmark :automotive:assembleBenchmark --stacktrace
      - name: Verify JNI names survive R8
        run: python3 scripts/check_jni_mapping.py
      - name: Install Android Emulator binary
        run: |
          curl --fail --location --retry 3 "https://dl.google.com/android/repository/emulator-linux_x64-16433917.zip" -o "$RUNNER_TEMP/emulator.zip"
          unzip -o -q "$RUNNER_TEMP/emulator.zip" -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/emulator/emulator"
      - name: Enable KVM for x86_64 emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: JNI DSP smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: ./gradlew :shared:connectedDebugAndroidTest --stacktrace
      - name: Capture DSP benchmark evidence
        if: always()
        run: |
          mkdir -p shared/build/outputs/dsp-benchmark
          timeout 20s adb logcat -d -v threadtime -s DspPipelineBenchmark:I > shared/build/outputs/dsp-benchmark/logcat.txt || true
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            automotive/build/reports/lint-results-debug.html
            shared/build/outputs/dsp-benchmark/
